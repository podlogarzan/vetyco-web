name: Supabase keep-alive

# Supabase pauses free-tier projects after roughly 7 days without activity, which
# would take the whole Vetyco app offline, sign-in included. One request a day
# keeps the backend awake.
#
# The key below is the *publishable* Supabase key. It is meant to be public and
# already ships inside the Android app; Row Level Security is what protects the
# data. An anonymous read of `pets` therefore returns an empty array, which is
# exactly what we want here: real activity, zero data exposure.

# Two failure modes bit us between 2026-09-12 and 2026-11-24, and both are handled below.
#   1. Once Supabase actually pauses, its hostname stops resolving, so this ping can only
#      PREVENT a pause, never undo one. 36 runs failed with "Could not resolve host" and
#      nobody noticed. Treat a red run here as "the backend is already down".
#   2. GitHub disables a scheduled workflow after 60 days without a commit to the repo
#      (status `disabled_inactivity`), which is what finally silenced it. The stamp step
#      below writes a dated file so the repo never goes stale.

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write # needed only for the staleness stamp below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://hfcshvzzeunjsuvxtjwm.supabase.co
          SUPABASE_KEY: sb_publishable_Dc0RMf9r3WzzoAUJtfhh8g_mnrQnPQl
        run: |
          url="$SUPABASE_URL/rest/v1/pets?select=id&limit=1"
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" "$url")
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          test "$code" = "200"

      - name: Keep the repo from going stale
        uses: actions/checkout@v4
      - name: Stamp the last successful ping
        run: |
          date -u +'%Y-%m-%d' > .keepalive
          if ! git diff --quiet .keepalive; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -am "Keep-alive stamp $(cat .keepalive)"
            git push
          fi
